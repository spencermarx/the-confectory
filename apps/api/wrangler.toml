name = "confectory-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# §3.3, §10.3: Workers AI binding. Phase 2 turns this on so the
# DO swaps InProcessFoundry for WorkersAIFoundry (and the slow Critic
# queue swaps to WorkersAICritic). The binding is optional at the type
# level so local dev stays fast.
[ai]
binding = "AI"

# §3.2: Per-guest Durable Object + global factory singleton DO.
[[durable_objects.bindings]]
name = "GUEST_SESSION"
class_name = "GuestSessionDO"

[[durable_objects.bindings]]
name = "FACTORY_STATE"
class_name = "FactoryStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuestSessionDO", "FactoryStateDO"]

# §3.4: D1 for structured per-guest persistence.
[[d1_databases]]
binding = "DB"
database_name = "confectory"
database_id = "REPLACE_ME"
migrations_dir = "../../infra/migrations/d1"

# §3.4: KV for shell metadata + config.
[[kv_namespaces]]
binding = "SHELLS_KV"
id = "REPLACE_ME"

# §3.4: R2 for assets.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "confectory-assets"

# §3.4: Vectorize for episodic memory.
[[vectorize]]
binding = "MEMORY"
index_name = "confectory-episodic-memory"

# §3.4: Queues for background jobs (slow Critic, summarization).
[[queues.producers]]
binding = "BACKGROUND"
queue = "confectory-background"

[[queues.consumers]]
queue = "confectory-background"
max_batch_size = 10
max_batch_timeout = 30

# §16.3: Analytics Engine for high-volume telemetry events.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "confectory_telemetry"

[vars]
ENVIRONMENT = "development"

[observability]
enabled = true
